<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="t d">
  <title id="t">The editor commits before any reader runs</title>
  <desc id="d">The editor reads the full text and saves its checks. Only then do independent readers, who see partial text, ask their questions. Each question is compared with the saved checks before anything reaches the report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="288" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
    <text x="40" y="52" font-size="22" font-weight="700">The editor commits before any reader runs</text>
    <text x="40" y="80" font-size="14" fill="#59636e">Reader questions are evidence to weigh against the editor’s saved checks, not findings in themselves.</text>

    <!-- lock line -->
    <line x1="405" y1="116" x2="405" y2="214" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="405" y="110" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">locked before readers run</text>

    <!-- boxes -->
    <rect x="40" y="128" width="160" height="72" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
    <rect x="230" y="128" width="160" height="72" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
    <rect x="420" y="128" width="160" height="72" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
    <rect x="610" y="128" width="160" height="72" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6"/>
    <rect x="800" y="128" width="160" height="72" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.8"/>
    <g text-anchor="middle">
      <g font-size="15" font-weight="700">
        <text x="120" y="160">Editor</text>
        <text x="310" y="160">Editor’s checks</text>
        <text x="500" y="160">Readers</text>
        <text x="690" y="160">Compare</text>
        <text x="880" y="160">Report</text>
      </g>
      <g font-size="12" fill="#59636e">
        <text x="120" y="181">reads the full text</text>
        <text x="310" y="181">saved and locked</text>
        <text x="500" y="181" fill="#0550ae">see partial text only</text>
        <text x="690" y="181">each question vs. checks</text>
        <text x="880" y="181" fill="#116329">edits and questions</text>
      </g>
    </g>

    <g stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="202" y1="164" x2="228" y2="164"/>
      <line x1="392" y1="164" x2="418" y2="164"/>
      <line x1="582" y1="164" x2="608" y2="164"/>
      <line x1="772" y1="164" x2="798" y2="164"/>
    </g>

    <text x="40" y="258" font-size="13" fill="#59636e">Each stage is saved in order and hashed with the one before it, so every finding in the report traces back to the record.</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
  <title id="t">Every suggested edit is checked for meaning</title>
  <desc id="d">A separate auditor with no tools and no memory compares a suggested wording with the original. If the meaning is kept, the edit is recorded. If it changed, the edit is rewritten or turned into a question for the author. In the example, the suggestion dropped the hedges "may" and "in most cases", so the meaning changed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
    <text x="40" y="52" font-size="22" font-weight="700">Every suggested edit is checked for meaning</text>
    <text x="40" y="80" font-size="14" fill="#59636e">A separate auditor, with no tools and no memory, compares the new wording with the original.</text>

    <!-- original and suggested -->
    <rect x="40" y="108" width="380" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="58" y="130" font-size="12" font-weight="700" fill="#59636e">Original</text>
    <text x="58" y="156" font-size="15">The method <tspan fill="#9a6700" font-weight="700">may</tspan> reduce errors <tspan fill="#9a6700" font-weight="700">in most cases</tspan>.</text>
    <rect x="40" y="188" width="380" height="64" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="58" y="210" font-size="12" font-weight="700" fill="#59636e">Suggested</text>
    <text x="58" y="236" font-size="15">The method reduces errors.</text>

    <g stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="422" y1="140" x2="470" y2="170"/>
      <line x1="422" y1="220" x2="470" y2="190"/>
    </g>

    <!-- auditor -->
    <rect x="472" y="146" width="156" height="68" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
    <text x="550" y="175" font-size="15" font-weight="700" text-anchor="middle">Auditor</text>
    <text x="550" y="196" font-size="12" fill="#0550ae" text-anchor="middle">no tools, no memory</text>
    <text x="550" y="238" font-size="12" fill="#59636e" text-anchor="middle">claim strength, numbers,</text>
    <text x="550" y="254" font-size="12" fill="#59636e" text-anchor="middle">hedges, causal words, …</text>

    <g stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="630" y1="170" x2="686" y2="140"/>
      <line x1="630" y1="190" x2="686" y2="220"/>
    </g>

    <!-- outcomes -->
    <rect x="688" y="116" width="272" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="704" y="143" font-size="14" fill="#116329"><tspan font-weight="700">Meaning kept</tspan> → edit recorded</text>
    <rect x="688" y="198" width="272" height="44" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="704" y="225" font-size="14" fill="#a40e26"><tspan font-weight="700">Changed</tspan> → rewrite or ask the author</text>
    <text x="688" y="266" font-size="12" fill="#a40e26">Here: “may” and “in most cases” were dropped.</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Masked reading</title>
  <desc id="d">The manuscript is split into windows. Each window is read by a new model reader with no memory of the text. A reader sees only its own window and the short notes left by the previous reader, and reports what it cannot yet understand.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <g id="note">
      <path d="M0,0 h16 l6,6 v20 h-22 z" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
      <path d="M16,0 v6 h6" fill="none" stroke="#d4a72c" stroke-width="1.5"/>
      <rect x="4" y="11" width="13" height="2" fill="#bf8700"/>
      <rect x="4" y="16" width="13" height="2" fill="#bf8700"/>
    </g>
    <g id="lines">
      <rect x="0" y="0" width="140" height="4" rx="2" fill="#c9d1d9"/>
      <rect x="0" y="11" width="140" height="4" rx="2" fill="#c9d1d9"/>
      <rect x="0" y="22" width="96" height="4" rx="2" fill="#c9d1d9"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="358" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
    <text x="40" y="52" font-size="22" font-weight="700">Masked reading: a new reader for every window</text>
    <text x="40" y="80" font-size="14" fill="#59636e">Each reader sees one window plus the previous reader’s notes (at most 180 words), never the text ahead.</text>

    <!-- windows -->
    <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5">
      <rect x="80" y="108" width="180" height="74" rx="8"/>
      <rect x="300" y="108" width="180" height="74" rx="8"/>
      <rect x="520" y="108" width="180" height="74" rx="8"/>
      <rect x="740" y="108" width="180" height="74" rx="8"/>
    </g>
    <g font-size="13" font-weight="600" fill="#59636e">
      <text x="100" y="132">Window 1</text><text x="320" y="132">Window 2</text><text x="540" y="132">Window 3</text><text x="760" y="132">Window 4</text>
    </g>
    <use href="#lines" x="100" y="146"/><use href="#lines" x="320" y="146"/><use href="#lines" x="540" y="146"/><use href="#lines" x="760" y="146"/>

    <!-- window to reader -->
    <g stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="170" y1="184" x2="170" y2="220"/><line x1="390" y1="184" x2="390" y2="220"/><line x1="610" y1="184" x2="610" y2="220"/><line x1="830" y1="184" x2="830" y2="220"/>
    </g>

    <!-- readers -->
    <g fill="#ddf4ff" stroke="#0969da" stroke-width="1.8">
      <rect x="95" y="224" width="150" height="58" rx="10"/>
      <rect x="315" y="224" width="150" height="58" rx="10"/>
      <rect x="535" y="224" width="150" height="58" rx="10"/>
      <rect x="755" y="224" width="150" height="58" rx="10"/>
    </g>
    <g text-anchor="middle">
      <g font-size="15" font-weight="700">
        <text x="170" y="249">Reader 1</text><text x="390" y="249">Reader 2</text><text x="610" y="249">Reader 3</text><text x="830" y="249">Reader 4</text>
      </g>
      <g font-size="12" fill="#0550ae">
        <text x="170" y="269">fresh context</text><text x="390" y="269">fresh context</text><text x="610" y="269">fresh context</text><text x="830" y="269">fresh context</text>
      </g>
    </g>

    <!-- notes passed between readers -->
    <g stroke="#d4a72c" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="247" y1="253" x2="312" y2="253"/><line x1="467" y1="253" x2="532" y2="253"/><line x1="687" y1="253" x2="752" y2="253"/>
    </g>
    <use href="#note" x="269" y="240"/><use href="#note" x="489" y="240"/><use href="#note" x="709" y="240"/>
    <g font-size="12" fill="#9a6700" text-anchor="middle">
      <text x="280" y="300">notes</text><text x="500" y="300">notes</text><text x="720" y="300">notes</text>
    </g>

    <text x="40" y="336" font-size="13" fill="#59636e">Each reader lists what it cannot yet understand. The editor later checks those questions against the full text.</text>
  </g>
</svg>
